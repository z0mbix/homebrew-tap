name: Test formulae

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tap the checked-out revision
        run: brew tap z0mbix/tap "$GITHUB_WORKSPACE"
      - name: Check formula style
        run: brew style z0mbix/tap
      - name: Install and test formulae
        shell: bash
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            name="z0mbix/tap/$(basename "$formula" .rb)"
            brew install "$name"
            brew audit --strict "$name"
            brew test "$name"
          done
